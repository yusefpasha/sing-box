name: Build Android Library Only (.aar)

on:
  workflow_dispatch:

jobs:
  build_aar:
    name: Build AAR Library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25.5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Get Version
        id: get_ver
        run: |
          VERSION=$(go run ./cmd/internal/read_tag 2>/dev/null || git describe --tags --always)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install Dependencies & Build Library
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android

      - name: Rename AAR File
        run: |
          mv *.aar singbox-core.aar

      - name: Upload AAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singbox-core-${{ env.VERSION }}
          path: singbox-core.aar