name: Build Android Core (Fixed & Stable)

on:
  workflow_dispatch:

jobs:
  build_aar:
    name: Build AAR Library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      # 1. Fetch and Checkout Latest Stable Tag
      - name: Checkout Latest Stable Version
        id: checkout_stable
        run: |
          git remote add upstream https://github.com/sagernet/sing-box.git
          git fetch upstream --tags
          # Get the latest stable version (exclude beta/alpha)
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -v -E 'beta|alpha|rc' | head -n 1)
          echo "Found latest stable version: $LATEST_TAG"
          
          git checkout $LATEST_TAG
          git submodule update --init --recursive
          echo "VERSION=$LATEST_TAG" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.23

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      # 2. Install Gomobile Toolchain
      - name: Install Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          $(go env GOPATH)/bin/gomobile init

      # 3. CRITICAL FIX: Explicitly get the bind package and dependencies
      # This fixes "unable to import bind" and "no exported names" errors
      - name: Fix Dependencies
        run: |
          # Download the bind package required by gobind
          go get golang.org/x/mobile/bind
          # Ensure all other modules are downloaded
          go mod download
          # Tidy up to ensure go.mod is consistent
          go mod tidy

      # 4. Build Manually (Without Naive)
      - name: Build Library Custom
        run: |
          # Tags required for functionality (excluding naive to prevent linker errors)
          TAGS="with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_conntrack,with_ech"
          
          # Run gomobile bind
          gomobile bind -v -target=android -androidapi 21 \
          -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=${{ env.VERSION }}" \
          -o singbox-core.aar \
          -tags "$TAGS" \
          ./mobile

      - name: Rename AAR File
        run: |
          mv *.aar singbox-core.aar

      - name: Upload AAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singbox-core-${{ env.VERSION }}
          path: singbox-core.aar