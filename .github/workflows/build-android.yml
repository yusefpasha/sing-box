name: Build Android Core (Stable - Lightweight)

on:
  workflow_dispatch:

jobs:
  build_aar:
    name: Build AAR Library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      # مرحله 1: پیدا کردن آخرین نسخه پایدار (Stable)
      - name: Checkout Latest Stable Version
        id: checkout_stable
        run: |
          git remote add upstream https://github.com/sagernet/sing-box.git
          git fetch upstream --tags
          # فیلتر کردن نسخه‌های بتا و انتخاب آخرین نسخه اصلی
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -v -E 'beta|alpha|rc' | head -n 1)
          echo "Found latest stable version: $LATEST_TAG"
          
          git checkout $LATEST_TAG
          git submodule update --init --recursive
          echo "VERSION=$LATEST_TAG" >> $GITHUB_ENV

      # مرحله 2: نصب Go نسخه جدید (سازگار با نسخه های جدید sing-box)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.23

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      # مرحله 3: نصب ابزار Gomobile
      - name: Install Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          # مقداردهی اولیه gomobile
          $(go env GOPATH)/bin/gomobile init

      # مرحله 4: بیلد دستی با تگ‌های ضروری (بدون naive)
      - name: Build Library Custom
        run: |
          # این تگ‌ها برای VLESS Reality, Hysteria2 و ... ضروری هستند
          # with_clash_api برای مدیریت سرویس‌ها و آمار لازم است
          # with_gvisor برای مدیریت TUN در اندروید حیاتی است
          TAGS="with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_conntrack,with_ech"
          
          gomobile bind -v -target=android -androidapi 21 \
          -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=${{ env.VERSION }}" \
          -o singbox-core.aar \
          -tags "$TAGS" \
          ./mobile

      - name: Upload AAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singbox-core-${{ env.VERSION }}
          path: singbox-core.aar