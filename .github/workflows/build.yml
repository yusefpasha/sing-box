name: Build

permissions:
  contents: write
  packages: write  # این دسترسی برای انتشار در GitHub Packages الزامی است

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g., 1.10.0)"
        required: true
        type: string
      build:
        description: "Build type"
        required: true
        type: choice
        default: "Android"
        options:
          - Android
  push:
    branches:
      - main-next
      - dev-next

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.build }}
  cancel-in-progress: true

jobs:
  calculate_version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.outputs.outputs.version }}
      is_prerelease: ${{ steps.check_prerelease.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25.5
      - name: Check input version
        if: github.event_name == 'workflow_dispatch'
        run: |-
          echo "version=${{ inputs.version }}"
          echo "version=${{ inputs.version }}" >> "$GITHUB_ENV"
      - name: Calculate version
        if: github.event_name != 'workflow_dispatch'
        run: |-
          go run -v ./cmd/internal/read_tag --ci --nightly
      - name: Set outputs
        id: outputs
        run: |-
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check Prerelease
        id: check_prerelease
        run: |
          if [[ "$version" == *"-"* ]] || [[ "$version" == *"alpha"* ]] || [[ "$version" == *"beta"* ]] || [[ "$version" == *"rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

  build_android:
    name: Build Android
    if: github.event_name != 'workflow_dispatch' || inputs.build == 'All' || inputs.build == 'Android'
    runs-on: ubuntu-latest
    needs:
      - calculate_version
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          submodules: 'recursive'
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25.5
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - name: Setup OpenJDK
        run: |-
          sudo apt update && sudo apt install -y openjdk-17-jdk-headless
      - name: Set tag
        run: |-
          git tag v${{ needs.calculate_version.outputs.version }} -f || true
      - name: Build library
        run: |-
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Prepare upload
        run: |-
          mkdir -p dist
          AAR_FILE=$(find . -maxdepth 1 -name "*.aar" | head -n 1)
          if [ -n "$AAR_FILE" ]; then
            echo "Found AAR file: $AAR_FILE"
            cp "$AAR_FILE" dist/sing-box-android.aar
          else
            echo "Error: No .aar file found!"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-android-aar
          path: 'dist/*'

  publish_package:
    name: Publish to GitHub Packages
    needs:
      - calculate_version
      - build_android
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: binary-android-aar
          path: dist

      - name: Setup Java/Maven
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Publish to GitHub Packages
        run: |
          # Define variables
          VERSION="${{ needs.calculate_version.outputs.version }}"
          # Convert username to lowercase for Group ID (Maven convention)
          GROUP_ID="io.github.$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')"
          ARTIFACT_ID="sing-box-android"
          FILE_PATH="dist/sing-box-android.aar"

          echo "Publishing $ARTIFACT_ID version $VERSION to GitHub Packages..."
          
          # Use mvn deploy-file to publish the AAR directly without a pom.xml
          mvn deploy:deploy-file \
            -DgroupId=$GROUP_ID \
            -DartifactId=$ARTIFACT_ID \
            -Dversion=$VERSION \
            -Dpackaging=aar \
            -Dfile=$FILE_PATH \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/${{ github.repository }} \
            --batch-mode
        env:
          # Maven uses this env var for authentication (configured in settings.xml implicitly by setup-java or passed directly)
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Settings.xml for Auth
        # Setup-java doesn't auto-configure deploy-file auth perfectly, so we force a settings.xml
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>${{ github.actor }}</username><password>${{ secrets.GITHUB_TOKEN }}</password></server></servers></settings>" > ~/.m2/settings.xml

  upload_release:
    name: Publish Release Assets
    needs:
      - calculate_version
      - build_android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.calculate_version.outputs.version }}
          name: Release v${{ needs.calculate_version.outputs.version }}
          files: dist/*
          draft: false
          prerelease: ${{ needs.calculate_version.outputs.is_prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}